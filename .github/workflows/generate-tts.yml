name: VibeVoice Hindi Text-to-Speech

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  convert-text-to-speech:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        # एरर ठीक करने के लिए कैशिंग विकल्प को यहाँ से हटा दिया गया है

    - name: Install uv and VibeVoice Dependencies
      run: |
        curl -LsSf https://astral.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
        git clone https://github.com
        cd VibeVoice
        uv pip install --system -e .
        uv pip install --system huggingface_hub scipy torch

    - name: Run Hindi TTS Script
      run: |
        python generate_speech.py

    - name: Upload Generated Audio Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hindi-voice-audio
        path: hindi_output.wav
