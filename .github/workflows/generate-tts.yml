name: Generate Male Hindi TTS using XTTS-v2

on:
  workflow_dispatch:
    inputs:
      hindi_text:
        description: 'Enter Hindi Text for Male Voice'
        required: true
        default: 'नमस्ते, यह XTTS-v2 मॉडल से जनरेट की गई एक पुरुष की आवाज़ है।'
        type: string

jobs:
  generate-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run TTS Generation Script
        env:
          HUGGINGFACE_TOKEN: ${{ secrets.HF_TOKEN }}
          INPUT_TEXT: ${{ github.event.inputs.hindi_text }}
        run: |
          python generate_xtts.py

      - name: Upload Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindi-male-speech
          path: male_output.wav
