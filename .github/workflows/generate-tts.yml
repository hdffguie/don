name: Generate Real Hindi TTS

on:
  workflow_dispatch:
    inputs:
      text_input:
        description: 'Enter Hindi text'
        required: true
        default: 'नमस्ते, यह एकदम असली पुरुष की आवाज़ है।'
        type: string

jobs:
  build-tts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Generate Speech Audio
        run: |
          # hi-IN-MadhurNeural ek bahut hi badiya aur natural Male voice hai
          edge-tts --voice hi-IN-MadhurNeural --text "${{ github.event.inputs.text_input }}" --write-media male_output.mp3

      - name: Upload Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindi-speech-audio
          path: male_output.mp3
