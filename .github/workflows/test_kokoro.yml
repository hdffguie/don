name: 🧪 Test Piper AI Voice

on:
  workflow_dispatch:

jobs:
  test-piper-tts:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Piper TTS & Requests
      run: pip install piper-tts requests

    - name: Run Piper Test Script
      run: python test_piper.py

    - name: Upload Audio for Download 🎧
      uses: actions/upload-artifact@v4
      with:
        name: Piper_Test_Audio
        path: piper_test_voice.wav
